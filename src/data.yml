      current: true
    - name: feature/agentic-backends
    - name: feature/llm-evaluation
    - name: explore/elixir
    - name: explore/pi
    - name: explore/spec-driven-development
    - name: chore/web-security
uses:
  command: btop --view stack — daily usage && working memory
  cpu:
    label: CPU [daily usage]
    usage:
      - label: editor
        percent: 100
        detail: neovim
      - label: harness
        percent: 80/20
        detail: claude code / pi
      - label: terminal
        percent: 60
        detail: kitty + git
      - label: cloud
        percent: 40
        detail: azure
        note: (functions, foundry)
  memory:
    label: MEM [working memory]
    usage:
      - text: building personal blog
      - text: updating this page
      - text: playing civ 6 hotseat
        note: (105/250 turns)
      - text: developing tournament planner
        note: (drafting)
  afk:
    label: afk
    items:
      - key: mtb
        value: Orbea Oiz M30
contact:

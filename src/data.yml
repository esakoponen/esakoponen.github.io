site:
  title: esakoponen
  description: Astro + Tailwind fastfetch-style portfolio template. TUI components, themeable systems, projects synced from GitHub via YAML.
  url: https://esakoponen.github.io
  author: esakoponen
  handle_suffix: github
  image: /og.png
  image_width: 1200
  image_height: 630
  theme_color: '#1793d1'
  job_title: astro-distro template
  social:
    github: ''
  twitter: ''
  locale: en
  type: website
  default_theme: arch
  footer:
    status: session closed
    errors: 0
    warnings: 0
    uptime: 5y

current: arch
booted_at: '2026-09-03'
host:
  name: xps
  cpu: Intel Core i7-10750H (12) @ 5.00 GHz
  gpu: NVIDIA GeForce GTX 1650 Ti Mobile
  memory: 32 GB
  resolution: 3840x2400
about:
  command: lazygit --view bio
  status:
    branch: main
    since: 2026
    ahead: 1
    behind: 0
    modified: 2
    untracked: 3
  bio:
    - icon: M
      text: Astro + Tailwind template for fastfetch-style portfolios
    - icon: M
      text: Single source of truth — content in YAML, generated in JSON
    - icon: M
      text: 26 distro themes, switchable from the header with no flash
    - icon: M
      text: Projects synced from GitHub, cached locally for 1 hour
    - icon: M
      text: SEO out of the box — OG, Twitter, JSON-LD, robots.txt
    - icon: M
      text: TypeScript strict, biome, bun test, GitHub Actions
    - icon: ??
      text: Fork this repo and edit data.yml to make it yours
  paths:
    - name: main
      current: true
    - name: feature/themes
    - name: feature/seo
    - name: feature/sync-script
    - name: feature/yaml-config
    - name: fix/components
    - name: docs/readme
uses:
  command: btop --view stack — daily usage && hardware
  cpu:
    label: CPU [daily usage]
    usage:
      - label: editor
        percent: 100
        detail: neovim
      - label: terminal
        percent: 60
        detail: kitty
      - label: browser
        percent: 20
        detail: firefox
      - label: notes
        percent: 10
        detail: obsidian
        note: (markdown sync)
      - label: music
        percent: 10
        detail: navidrome
        note: (lastfm scrobbling)
      - label: theme
        percent: 50
        detail: tokyo night
      - label: font
        percent: 40
        detail: Noto Sans Mono
  memory:
    used: 5
    total: 31
    theme: tokyo night
    themePercent: 50
  hardware:
    label: hardware
    device: Dell XPS
    ram: 32 GB
    os: Arch Linux x86_64
  peripherals:
    label: peripherals
    keyboard: steelseries
    mouse: Logitech
    headphones: generic
    monitor: 16" 4K built-in
contact:
  command: mutt -f firstname.lastname[at]gmail.com
  email: firstname.lastname[at]gmail.com
  inbox:
    - from: github.com
      href: https://github.com/esakoponen
    - from: firstname.lastname[at]gmail.com
